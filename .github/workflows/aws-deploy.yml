name: SSH Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add EC2 hosts to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST_FE }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.EC2_HOST_BE }} >> ~/.ssh/known_hosts
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy Frontend to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST_FE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # 1) Install Docker & Git if missing
            if ! command -v git >/dev/null || ! command -v docker >/dev/null; then
              sudo dnf update -y
              sudo dnf install -y docker git
              sudo systemctl enable --now docker
            fi

            # 2) Prepare app directory and get the latest code
            mkdir -p ~/app
            cd ~/app
            
            # Check if the repository exists and handle accordingly
            if [ -d .git ]; then
              # Repository exists, stash any local changes first
              echo "Repository exists, stashing local changes and pulling latest..."
              git config --global --add safe.directory $(pwd)
              git stash
              git pull origin main
            else
              # Repository doesn't exist or not a git repo, clone fresh
              echo "Repository doesn't exist or not a git repo, cloning fresh..."
              # Remove any existing files to ensure clean clone
              rm -rf * .[^.]*
              git clone https://github.com/NelisKaars/DigitalTwinAnalyzer.git .
            fi

            # 3) Build & restart frontend container
            cd ./3d-visualization-comparison
            sudo docker stop dashboard || true
            sudo docker rm dashboard || true
            sudo docker build --no-cache -t dashboard .
            sudo docker run -d --name dashboard -p 80:80 dashboard

      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST_BE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # 1) Install Docker & Git if missing
            if ! command -v git >/dev/null || ! command -v docker-compose >/dev/null; then
              sudo dnf update -y
              sudo dnf install -y git

              # Install Docker Engine
              curl -fsSL https://get.docker.com | sudo sh
              sudo systemctl enable --now docker

              sudo curl -L https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m) -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            # 2) Prepare app directory and get the latest code
            mkdir -p ~/app
            cd ~/app
            
            # Check if the repository exists and handle accordingly
            if [ -d .git ]; then
              # Repository exists, stash any local changes first
              echo "Repository exists, stashing local changes and pulling latest..."
              git config --global --add safe.directory $(pwd)
              git stash
              git pull origin main
            else
              # Repository doesn't exist or not a git repo, clone fresh
              echo "Repository doesn't exist or not a git repo, cloning fresh..."
              # Remove any existing files to ensure clean clone
              rm -rf * .[^.]*
              git clone https://github.com/NelisKaars/DigitalTwinAnalyzer.git .
            fi

            # 3) Build & restart backend container
            cd ./ditto-master/deployment/docker/
            # Run docker-compose directly from the host machine
            docker-compose down || true
            docker-compose up -d
            
            # 4) Wait for Ditto services to be ready
            echo "Waiting for Ditto services to start up..."
            sleep 30
            
            # Check if Ditto is responding
            MAX_RETRIES=12
            RETRY_COUNT=0
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -f -s "http://localhost:8080/status" >/dev/null 2>&1; then
                echo "Ditto services are ready!"
                break
              fi
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "Waiting for Ditto... (attempt $RETRY_COUNT/$MAX_RETRIES)"
              sleep 10
            done
            
            # 5) Deploy custom frontend to backend nginx container
            echo "Deploying custom frontend to backend nginx container..."
            
            # Get the nginx container name
            NGINX_CONTAINER=$(docker-compose ps --format "table {{.Names}}\t{{.Image}}" | grep nginx | awk '{print $1}')
            
            if [ -n "$NGINX_CONTAINER" ]; then
              # Create the app directory in the container
              docker exec $NGINX_CONTAINER mkdir -p /usr/share/nginx/html/app
              
              # Copy frontend files to the container
              docker cp ../../3d-visualization-comparison/. $NGINX_CONTAINER:/usr/share/nginx/html/app/
              
              # Set proper permissions
              docker exec $NGINX_CONTAINER chown -R nginx:nginx /usr/share/nginx/html/app 2>/dev/null || true
              docker exec $NGINX_CONTAINER chmod -R 755 /usr/share/nginx/html/app
              
              # Reload nginx configuration
              docker exec $NGINX_CONTAINER nginx -s reload
              
              echo "✅ Custom frontend deployed successfully!"
              echo "🌐 Access your custom frontend at: http://54.217.116.62:8080/app/"
              echo "🔧 Access dashboard at: http://54.217.116.62:8080/app/dashboard.html"
            else
              echo "⚠️ Could not find nginx container"
            fi
            
            # 6) Initialize the Factory digital twin
            if [ -f ./create-factory-twin.sh ]; then
              echo "Creating Factory digital twin..."
              chmod +x ./create-factory-twin.sh
              ./create-factory-twin.sh
              echo "✅ Factory digital twin initialization complete!"
            else
              echo "⚠️ Factory twin creation script not found"
            fi