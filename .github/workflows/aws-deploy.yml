name: SSH Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add EC2 hosts to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST_FE }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.EC2_HOST_BE }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy Frontend to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST_FE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # 1) Prepare app directory
            mkdir -p ~/app && cd ~/app

            # 2) Clone or pull latest
            if [ ! -d .git ]; then
              git clone git@github.com:NelisKaars/DigitalTwinAnalyzer.git .
            else
              git pull origin main
            fi

            # 3) Install Docker & Git if missing
            if ! command -v docker >/dev/null; then
              if command -v yum >/dev/null; then
                sudo yum update -y
                sudo amazon-linux-extras install -y docker
                sudo systemctl enable --now docker
              elif command -v dnf >/dev/null; then
                sudo dnf update -y
                sudo dnf install -y docker
                sudo systemctl enable --now docker
              elif command -v apt-get >/dev/null; then
                sudo apt-get update
                sudo apt-get install -y docker.io
                sudo systemctl enable --now docker
              fi
            fi

            # 4) Build & restart frontend container
            sudo docker stop dashboard  || true
            sudo docker rm   dashboard  || true
            sudo docker build -t dashboard ./frontend
            sudo docker run -d --name dashboard -p 80:80 dashboard

      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST_BE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            mkdir -p ~/app && cd ~/app

            if [ ! -d .git ]; then
              git clone git@github.com:NelisKaars/DigitalTwinAnalyzer.git .
            else
              git pull origin main
            fi

            if ! command -v docker >/dev/null; then
              if command -v yum >/dev/null; then
                sudo yum update -y
                sudo amazon-linux-extras install -y docker
                sudo systemctl enable --now docker
              elif command -v dnf >/dev/null; then
                sudo dnf update -y
                sudo dnf install -y docker
                sudo systemctl enable --now docker
              elif command -v apt-get >/dev/null; then
                sudo apt-get update
                sudo apt-get install -y docker.io
                sudo systemctl enable --now docker
              fi
            fi

            sudo docker stop ditto  || true
            sudo docker rm   ditto  || true
            sudo docker build -t ditto ./backend
            sudo docker run -d --name ditto -p 8080:8080 ditto