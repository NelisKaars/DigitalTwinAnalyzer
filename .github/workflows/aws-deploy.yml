name: SSH Deploy to EC2 (via scp + ssh)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add EC2 hosts to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST_FE }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.EC2_HOST_BE }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy frontend code to EC2
        run: |
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            ./frontend/ ec2-user@${{ secrets.EC2_HOST_FE }}:/home/ec2-user/app/frontend/

      - name: Deploy Frontend on EC2
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes ec2-user@${{ secrets.EC2_HOST_FE }} << 'EOF'
            set -e

            # install Docker & Git if needed
            sudo dnf update -y && sudo dnf install -y docker git

            # build & (re)run
            cd ~/app/frontend
            sudo docker stop dashboard  || true
            sudo docker rm   dashboard  || true
            sudo docker build -t dashboard .
            sudo docker run -d --name dashboard -p 80:80 dashboard
          EOF

      - name: Copy backend code to EC2
        run: |
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            ./backend/ ec2-user@${{ secrets.EC2_HOST_BE }}:/home/ec2-user/app/backend/

      - name: Deploy Backend on EC2
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes ec2-user@${{ secrets.EC2_HOST_BE }} << 'EOF'
            set -e

            # install Docker & Git if needed
            sudo dnf update -y && sudo dnf install -y docker git

            # build & (re)run
            cd ~/app/backend
            sudo docker stop ditto  || true
            sudo docker rm   ditto  || true
            sudo docker build -t ditto .
            sudo docker run -d --name ditto -p 8080:8080 ditto
          EOF
