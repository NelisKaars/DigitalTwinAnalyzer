name: SSH Deploy to EC2 (DISABLED)

# This workflow is currently disabled in favor of the K3s deployment
# To re-enable, uncomment the "on" section below
# on:
#   push:
#     branches:
#       - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add EC2 hosts to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST_FE }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.EC2_HOST_BE }} >> ~/.ssh/known_hosts
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy Frontend to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST_FE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # 1) Install Docker & Git if missing
            if ! command -v git >/dev/null || ! command -v docker >/dev/null; then
              sudo dnf update -y
              sudo dnf install -y docker git
              sudo systemctl enable --now docker
            fi

            # 2) Prepare app directory and get the latest code
            mkdir -p ~/app
            cd ~/app
            
            # Check if the repository exists and handle accordingly
            if [ -d .git ]; then
              # Repository exists, stash any local changes first
              echo "Repository exists, stashing local changes and pulling latest..."
              git config --global --add safe.directory $(pwd)
              git stash
              git pull origin main
            else
              # Repository doesn't exist or not a git repo, clone fresh
              echo "Repository doesn't exist or not a git repo, cloning fresh..."
              # Remove any existing files to ensure clean clone
              rm -rf * .[^.]*
              git clone https://github.com/NelisKaars/DigitalTwinAnalyzer.git .
            fi

            # 3) Build & restart frontend container
            cd ./3d-visualization-comparison
            sudo docker stop dashboard || true
            sudo docker rm dashboard || true
            sudo docker build --no-cache -t dashboard .
            sudo docker run -d --name dashboard -p 80:80 dashboard

      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST_BE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # 0) Check disk space and extend filesystem if needed
            echo "===== DISK INFORMATION ====="
            df -h /
            
            # Extend filesystem if needed to use newly allocated space
            sudo growpart /dev/xvda 1 || true
            sudo xfs_growfs -d / || true
            
            echo "===== DISK INFORMATION AFTER EXTENSION ====="
            df -h /
            
            # Aggressive disk cleanup 
            echo "===== CLEANING UP DISK SPACE ====="
            sudo dnf clean all || true
            sudo rm -rf /var/cache/dnf/* || true
            sudo docker system prune -af || true
            sudo rm -rf /tmp/* || true
            
            # 1) Install Docker & Git if missing
            if ! command -v git >/dev/null || ! command -v docker >/dev/null; then
              sudo dnf update -y
              sudo dnf install -y git

              # Install Docker Engine
              curl -fsSL https://get.docker.com | sudo sh
              sudo systemctl enable --now docker

              sudo curl -L https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m) -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            # 2) Prepare app directory and get the latest code
            mkdir -p ~/app
            cd ~/app
            
            # Check if the repository exists and handle accordingly
            if [ -d .git ]; then
              # Repository exists, stash any local changes first
              echo "Repository exists, stashing local changes and pulling latest..."
              git config --global --add safe.directory $(pwd)
              git stash
              git pull origin main
            else
              # Repository doesn't exist or not a git repo, clone fresh
              echo "Repository doesn't exist or not a git repo, cloning fresh..."
              # Remove any existing files to ensure clean clone
              rm -rf * .[^.]*
              git clone https://github.com/NelisKaars/DigitalTwinAnalyzer.git .
            fi

            # 3) Build & restart backend container
            cd ./ditto-master/deployment/docker/
            # Run docker-compose directly from the host machine
            sudo docker-compose down || true
            sudo docker-compose up -d
            
            # 4) Initialize the Factory digital twin if script exists
            if [ -f ./create-factory-twin.sh ]; then
              chmod +x ./create-factory-twin.sh
              ./create-factory-twin.sh
            fi
            
            # 5) Add localhost:8080 entry to /etc/hosts
            echo "===== UPDATING /etc/hosts FILE ====="
            # Check if entry already exists
            if ! grep -q "127.0.0.1 localhost.ditto" /etc/hosts; then
              echo "Adding localhost.ditto entry to /etc/hosts..."
              echo "127.0.0.1 localhost.ditto" | sudo tee -a /etc/hosts
            fi
            
            # Create a simple redirect service that will bind to localhost:8080
            echo "===== CREATING REDIRECT SERVICE ====="
            
            # Install socat (much smaller than Node.js)
            sudo dnf install -y socat || true
            
            # Create a simple service file that redirects localhost:8080 to the gateway
            cat > ditto-redirect.service << 'EOL'
            [Unit]
            Description=Ditto localhost redirect
            After=network.target

            [Service]
            ExecStart=/usr/bin/socat TCP-LISTEN:8080,fork TCP:localhost:80
            Restart=always
            User=root

            [Install]
            WantedBy=multi-user.target
            EOL
            
            # Install and start the service
            sudo mv ditto-redirect.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable ditto-redirect.service
            sudo systemctl restart ditto-redirect.service
            
            echo "===== CONFIGURATION COMPLETE ====="
            echo "Ditto should now be accessible at localhost:8080"