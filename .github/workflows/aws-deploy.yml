name: SSH Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. (Optional) Have the runner check out your repo,
      #    in case you want to copy scripts or files to the servers.
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Install your deploy key on the runner
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # 3. Prevent host‐key prompts
      - name: Add EC2 hosts to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST_FE }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.EC2_HOST_BE }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # 4. Deploy your Frontend
      - name: Deploy Frontend to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST_FE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # clone if needed, else pull latest
            cd /home/ec2-user/app || git clone git@github.com:NelisKaars/DigitalTwinAnalyzer.git app
            cd app && git pull origin main
            # ensure Podman
            sudo amazon-linux-extras install -y podman
            # rebuild & restart container
            podman stop dashboard || true
            podman rm dashboard  || true
            podman build -t dashboard ./frontend
            podman run -d --name dashboard -p 80:80 dashboard

      # 5. Deploy your Backend
      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST_BE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ec2-user/app || git clone git@github.com:NelisKaars/DigitalTwinAnalyzer.git app
            cd app && git pull origin main
            sudo amazon-linux-extras install -y podman
            podman stop ditto || true
            podman rm ditto  || true
            podman build -t ditto ./backend
            podman run -d --name ditto -p 8080:8080 ditto