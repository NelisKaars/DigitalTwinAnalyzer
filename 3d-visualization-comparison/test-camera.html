<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Camera Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #container {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #f0f0f0;
        }
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }
        button {
            margin: 5px;
            padding: 8px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div class="controls">
        <h3>Camera Test</h3>
        <div>
            <button id="position1">Position 1</button>
            <button id="position2">Position 2</button>
            <button id="position3">Position 3</button>
        </div>
        <div>
            <button id="startPath">Start Path</button>
            <button id="stopPath">Stop Path</button>
        </div>
        <div id="status">Status: Ready</div>
    </div>

    <!-- Load Three.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // Simple Three.js scene setup
        let camera, scene, renderer, controls;
        let animationFrame = null;
        let pathAnimation = null;
        
        // Camera waypoints for testing
        const waypoints = [
            { 
                position: [0, 5, 15],
                target: [0, 0, 0],
                up: [0, 1, 0]
            },
            { 
                position: [10, 3, 5],
                target: [0, 2, 0],
                up: [0, 1, 0]
            },
            { 
                position: [-8, 3, 5],
                target: [0, 0, 0],
                up: [0, 1, 0]
            }
        ];
        
        // Initialize the scene
        function init() {
            // Create container
            const container = document.getElementById('container');
            
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);
            
            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Add some objects to the scene
            addObjects();
            
            // Add lights
            addLights();
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize);
            
            // Add button event listeners
            document.getElementById('position1').addEventListener('click', () => moveToPosition(0));
            document.getElementById('position2').addEventListener('click', () => moveToPosition(1));
            document.getElementById('position3').addEventListener('click', () => moveToPosition(2));
            document.getElementById('startPath').addEventListener('click', startCameraPath);
            document.getElementById('stopPath').addEventListener('click', stopCameraPath);
            
            // Start animation loop
            animate();
        }
        
        // Add simple objects to the scene
        function addObjects() {
            // Ground plane
            const groundGeometry = new THREE.PlaneGeometry(30, 30);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xcccccc,
                roughness: 0.8,
                metalness: 0.2
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Add some cubes
            const cubeGeometry = new THREE.BoxGeometry(2, 2, 2);
            
            // Red cube
            const redMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const redCube = new THREE.Mesh(cubeGeometry, redMaterial);
            redCube.position.set(5, 1, 0);
            scene.add(redCube);
            
            // Blue cube
            const blueMaterial = new THREE.MeshStandardMaterial({ color: 0x0000ff });
            const blueCube = new THREE.Mesh(cubeGeometry, blueMaterial);
            blueCube.position.set(-5, 1, 0);
            scene.add(blueCube);
            
            // Green cube
            const greenMaterial = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
            const greenCube = new THREE.Mesh(cubeGeometry, greenMaterial);
            greenCube.position.set(0, 1, -5);
            scene.add(greenCube);
        }
        
        // Add lights to the scene
        function addLights() {
            // Ambient light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            // Directional light (sun)
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
        }
        
        // Handle window resize
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Animation loop
        function animate() {
            animationFrame = requestAnimationFrame(animate);
            
            // Update controls
            controls.update();
            
            // Render
            renderer.render(scene, camera);
        }
        
        // Move camera to a specific waypoint
        function moveToPosition(index) {
            if (index < 0 || index >= waypoints.length) return;
            
            const waypoint = waypoints[index];
            
            // Update status
            document.getElementById('status').textContent = `Status: Moving to Position ${index + 1}`;
            
            // Set camera position
            camera.position.set(
                waypoint.position[0],
                waypoint.position[1],
                waypoint.position[2]
            );
            
            // Set control target (where the camera looks at)
            controls.target.set(
                waypoint.target[0],
                waypoint.target[1],
                waypoint.target[2]
            );
            
            // Set camera up vector
            camera.up.set(
                waypoint.up[0],
                waypoint.up[1],
                waypoint.up[2]
            );
            
            // Update controls
            controls.update();
        }
        
        // Start camera path animation
        function startCameraPath() {
            if (pathAnimation) {
                stopCameraPath();
            }
            
            document.getElementById('status').textContent = 'Status: Camera path active';
            
            let startTime = performance.now();
            const duration = 15000; // 15 seconds for full path
            
            pathAnimation = setInterval(() => {
                const now = performance.now();
                const elapsed = now - startTime;
                
                if (elapsed > duration) {
                    startTime = now;
                }
                
                // Calculate progress (0 to 1)
                const pathTime = (elapsed % duration) / duration;
                
                // Calculate current and next waypoint indices
                const waypointCount = waypoints.length;
                const totalProgress = pathTime * waypointCount;
                const currentIndex = Math.floor(totalProgress);
                const nextIndex = (currentIndex + 1) % waypointCount;
                
                // Calculate progress between the two waypoints (0 to 1)
                const segmentProgress = totalProgress - currentIndex;
                
                // Get the current and next waypoints
                const current = waypoints[currentIndex];
                const next = waypoints[nextIndex];
                
                // Interpolate between waypoints
                const position = interpolateVector(current.position, next.position, segmentProgress);
                const target = interpolateVector(current.target, next.target, segmentProgress);
                const up = interpolateVector(current.up, next.up, segmentProgress);
                
                // Update camera
                camera.position.set(position[0], position[1], position[2]);
                controls.target.set(target[0], target[1], target[2]);
                camera.up.set(up[0], up[1], up[2]);
                
                // Update controls
                controls.update();
                
            }, 16); // ~60fps
        }
        
        // Stop camera path animation
        function stopCameraPath() {
            if (pathAnimation) {
                clearInterval(pathAnimation);
                pathAnimation = null;
                document.getElementById('status').textContent = 'Status: Ready';
            }
        }
        
        // Helper to interpolate between two vectors
        function interpolateVector(a, b, t) {
            return [
                a[0] + (b[0] - a[0]) * t,
                a[1] + (b[1] - a[1]) * t,
                a[2] + (b[2] - a[2]) * t
            ];
        }
        
        // Initialize everything when the page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
