#
# CORS header support for separate frontend/backend architecture
#
# Enhanced CORS configuration to properly handle cross-origin requests
# from separate frontend EC2 instance to backend Ditto services
#

set $cors '1';

# OPTIONS indicates a CORS pre-flight request
if ($request_method = 'OPTIONS') {
       set $cors "${cors}o";
}

if ($cors = '1') {
        # Allow requests from any origin (supports dynamic frontend IPs)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,Accept,Origin,X-Auth-Token' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,Location,ETag' always;
}

# OPTIONS (pre-flight) request handling
if ($cors = '1o') {
        # Tell client that this pre-flight info is valid for 20 days
        add_header 'Access-Control-Max-Age' 1728000 always;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,Accept,Origin,X-Auth-Token' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,Location,ETag' always;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' 0;
        return 200;
}
